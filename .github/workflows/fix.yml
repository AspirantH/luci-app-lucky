name: Update Lucky Version fixed
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      include_prerelease:
        description: Include beta release directories
        required: false
        default: "true"
permissions:
  contents: write
concurrency:
  group: update-lucky-version
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      RELEASE_BASE: https://release.66666.host
      LUCKY_VARIANT: lucky
      INCLUDE_PRERELEASE: ${{ github.event.inputs.include_prerelease || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest upstream lucky release
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RELEASE_BASE}" "${LUCKY_VARIANT}" "${INCLUDE_PRERELEASE}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import re
          import sys
          import urllib.request

          release_base, variant, include_prerelease = sys.argv[1:]

          BROWSER_UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/124.0.0.0 Safari/537.36"
          )

          def fetch(url: str, accept: str) -> str:
              req = urllib.request.Request(url, headers={
                  "User-Agent": BROWSER_UA,
                  "Accept": accept,
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read().decode("utf-8", errors="replace")

          def extract_names(raw: str):
              """从任意格式的响应里提取目录/文件名集合。"""
              names = set()

              # 1. 纯 JSON（数组或 {content:[...]}）
              try:
                  data = json.loads(raw)
                  items = []
                  if isinstance(data, list):
                      items = data
                  elif isinstance(data, dict):
                      for key in ("content", "files", "list", "items"):
                          if isinstance(data.get(key), list):
                              items = data[key]
                              break
                  for it in items:
                      if isinstance(it, dict) and "name" in it:
                          names.add(str(it["name"]))
                      elif isinstance(it, str):
                          names.add(it)
                  if names:
                      return names, "json"
              except Exception:
                  pass

              # 2. 页面内嵌 JSON（如 window.__DATA__ = {...}）
              for m in re.finditer(r'=\s*(\{.*?\}|\[.*?\])\s*[;<]', raw, re.S):
                  try:
                      data = json.loads(m.group(1))
                  except Exception:
                      continue
                  items = data if isinstance(data, list) else data.get("content", [])
                  for it in items:
                      if isinstance(it, dict) and "name" in it:
                          names.add(str(it["name"]))
                      elif isinstance(it, str):
                          names.add(it)
                  if names:
                      return names, "embedded-json"

              # 3. HTML href
              for href in re.findall(r'href="([^"]+)"', raw):
                  href = href.split("?")[0].split("#")[0]
                  seg = href.rstrip("/").split("/")[-1]
                  if seg:
                      names.add(seg)
              if names:
                  return names, "html-href"

              # 4. 纯文本（页面上直接列出的文件名/目录名）
              for m in re.findall(
                  r'(?<![\w./-])(v\d+\.\d+\.\d+(?:beta\d+)?)(?![\w./-])',
                  raw
              ):
                  names.add(m)
              for m in re.findall(
                  r'(?<![\w./-])([A-Za-z0-9_.\-]+\.tar\.gz)(?![\w./-])',
                  raw
              ):
                  names.add(m)

              return names, "text"

          stable_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          beta_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)beta(\d+)$")

          # ---- 1. 根目录 ----
          root_raw = fetch(f"{release_base}/", "text/html,application/json,*/*")
          root_names, root_mode = extract_names(root_raw)
          print(f"[debug] root parse mode = {root_mode}", file=sys.stderr)
          print(f"[debug] root names count = {len(root_names)}", file=sys.stderr)

          candidates = []
          for name in root_names:
              stable = stable_pattern.fullmatch(name)
              beta = beta_pattern.fullmatch(name)
              if stable:
                  major, minor, patch = map(int, stable.groups())
                  candidates.append(((major, minor, patch, 0), name))
              elif include_prerelease == "true" and beta:
                  major, minor, patch, beta_no = map(int, beta.groups())
                  candidates.append(((major, minor, patch, beta_no), name))

          if not candidates:
              # 打印实际拿到的内容前 2000 字节，方便定位
              print("=== ROOT RESPONSE (first 2000 bytes) ===", file=sys.stderr)
              print(root_raw[:2000], file=sys.stderr)
              print("=== ROOT NAMES SEEN ===", file=sys.stderr)
              print(sorted(root_names), file=sys.stderr)
              raise SystemExit(
                  "No matching Lucky release directories found "
                  f"(parse mode={root_mode})"
              )

          _, release_dir = max(candidates, key=lambda x: x[0])

          if "beta" in release_dir:
              m = beta_pattern.fullmatch(release_dir)
              ver_main = f"{m.group(1)}.{m.group(2)}.{m.group(3)}"
              ver_beta = f"beta{m.group(4)}"
          else:
              m = stable_pattern.fullmatch(release_dir)
              ver_main = f"{m.group(1)}.{m.group(2)}.{m.group(3)}"
              ver_beta = ""

          # ---- 2. 子目录 ----
          sub_path = f"/{release_dir}/{ver_main}_wanji/"
          sub_raw = fetch(f"{release_base}{sub_path}", "text/html,application/json,*/*")
          sub_names, sub_mode = extract_names(sub_raw)
          print(f"[debug] sub parse mode = {sub_mode}", file=sys.stderr)
          print(f"[debug] sub names count = {len(sub_names)}", file=sys.stderr)

          target_file = f"{variant}_{ver_main}_Linux_x86_64_wanji.tar.gz"
          if target_file not in sub_names:
              print("=== SUB RESPONSE (first 2000 bytes) ===", file=sys.stderr)
              print(sub_raw[:2000], file=sys.stderr)
              print("=== SUB NAMES SEEN ===", file=sys.stderr)
              print(sorted(sub_names), file=sys.stderr)
              raise SystemExit(
                  f"Missing asset: {target_file}\n"
                  f"Path: {sub_path}\n"
                  f"Parse mode: {sub_mode}"
              )

          print(f"VER_MAIN={ver_main}")
          print(f"VER_BETA={ver_beta}")
          print(f"FULL_VER={ver_main}{ver_beta}")
          PY

      - name: Compare & Update Makefile
        id: update
        shell: bash
        run: |
          set -euo pipefail
          MF="./lucky/Makefile"
          new_VER_MAIN="${{ steps.latest.outputs.VER_MAIN }}"
          new_VER_BETA="${{ steps.latest.outputs.VER_BETA }}"
          cur_VER_MAIN="$(sed -n 's/^VER_MAIN:=//p' "$MF" | head -n1)"
          cur_VER_BETA="$(sed -n 's/^VER_BETA:=//p' "$MF" | head -n1)"
          if [[ "$cur_VER_MAIN" == "$new_VER_MAIN" && "$cur_VER_BETA" == "$new_VER_BETA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -e "s/^VER_MAIN:=.*/VER_MAIN:=$new_VER_MAIN/" -e "s/^VER_BETA:=.*/VER_BETA:=$new_VER_BETA/" "$MF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & Push direct to branch
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          FULL_VER: ${{ steps.latest.outputs.FULL_VER }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lucky/Makefile
          git commit -m "chore: auto update lucky version to ${FULL_VER}"
          git push
