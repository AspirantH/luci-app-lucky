name: Update Lucky Version
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      include_prerelease:
        description: Include beta release directories
        required: false
        default: "true"
permissions:
  contents: write
concurrency:
  group: update-lucky-version
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      RELEASE_BASE: https://release.66666.host
      LUCKY_VARIANT: lucky
      INCLUDE_PRERELEASE: ${{ github.event.inputs.include_prerelease || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest upstream lucky release
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          root_html="$(mktemp)"
          curl -fsSL "${RELEASE_BASE}/" -o "${root_html}"

          python3 - "${root_html}" "${RELEASE_BASE}" "${LUCKY_VARIANT}" "${INCLUDE_PRERELEASE}" >> "${GITHUB_OUTPUT}" <<'PY'
          import re
          import sys
          import urllib.request

          root_html, release_base, variant, include_prerelease = sys.argv[1:]

          with open(root_html, encoding="utf-8", errors="replace") as fh:
              html = fh.read()

          hrefs = re.findall(r'href="([^"]+)"', html)
          dir_names = set()
          for href in hrefs:
              href = href.split("?")[0].split("#")[0]
              if not href.endswith("/"):
                  continue
              seg = href.rstrip("/").split("/")[-1]
              if seg:
                  dir_names.add(seg)

          stable_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          beta_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)beta(\d+)$")

          candidates = []
          for name in dir_names:
              stable = stable_pattern.fullmatch(name)
              beta = beta_pattern.fullmatch(name)
              if stable:
                  major, minor, patch = map(int, stable.groups())
                  candidates.append(((major, minor, patch, 0), name))
              elif include_prerelease == "true" and beta:
                  major, minor, patch, beta_no = map(int, beta.groups())
                  candidates.append(((major, minor, patch, beta_no), name))

          if not candidates:
              raise SystemExit("No matching Lucky release directories found")

          _, release_dir = max(candidates, key=lambda x: x[0])

          if "beta" in release_dir:
              m = beta_pattern.fullmatch(release_dir)
              ver_main = f"{m.group(1)}.{m.group(2)}.{m.group(3)}"
              ver_beta = f"beta{m.group(4)}"
          else:
              m = stable_pattern.fullmatch(release_dir)
              ver_main = f"{m.group(1)}.{m.group(2)}.{m.group(3)}"
              ver_beta = ""

          sub_folder = f"{ver_main}_wanji"
          full_sub_url = f"{release_base}/{release_dir}/{sub_folder}/"

          with urllib.request.urlopen(full_sub_url) as resp:
              sub_html = resp.read().decode("utf-8", errors="replace")

          sub_hrefs = re.findall(r'href="([^"]+)"', sub_html)
          sub_files = set()
          for href in sub_hrefs:
              href = href.split("?")[0].split("#")[0]
              name = href.rstrip("/").split("/")[-1]
              if name:
                  sub_files.add(name)

          target_file = f"{variant}_{ver_main}_Linux_x86_64_wanji.tar.gz"
          if target_file not in sub_files:
              raise SystemExit(
                  f"Missing asset: {target_file}\n"
                  f"Available files: {sorted(sub_files)}"
              )

          print(f"VER_MAIN={ver_main}")
          print(f"VER_BETA={ver_beta}")
          print(f"FULL_VER={ver_main}{ver_beta}")
          PY

      - name: Compare & Update Makefile
        id: update
        shell: bash
        run: |
          set -euo pipefail
          MF="./lucky/Makefile"
          new_VER_MAIN="${{ steps.latest.outputs.VER_MAIN }}"
          new_VER_BETA="${{ steps.latest.outputs.VER_BETA }}"
          cur_VER_MAIN="$(sed -n 's/^VER_MAIN:=//p' "$MF" | head -n1)"
          cur_VER_BETA="$(sed -n 's/^VER_BETA:=//p' "$MF" | head -n1)"
          if [[ "$cur_VER_MAIN" == "$new_VER_MAIN" && "$cur_VER_BETA" == "$new_VER_BETA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -e "s/^VER_MAIN:=.*/VER_MAIN:=$new_VER_MAIN/" -e "s/^VER_BETA:=.*/VER_BETA:=$new_VER_BETA/" "$MF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & Push direct to branch
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          FULL_VER: ${{ steps.latest.outputs.FULL_VER }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lucky/Makefile
          git commit -m "chore: auto update lucky version to ${FULL_VER}"
          git push
